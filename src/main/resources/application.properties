spring.application.name=backend_BodyFitGym

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/bd_bodyfitgym?createDatabaseIfNotExist=true
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update

# Ejecutar data.sql despues de que Hibernate cree/actualice las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

jwt.secret=BodyFitGymJwtDevSecretKeyCambiarAntesDeProduccion2026
jwt.expiration=86400000

